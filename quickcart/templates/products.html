<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCart - Products</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% include "nav.html" %}
<main>
  <h1>Products</h1>
  <section class="card filters">
    <input type="text" id="search-input" placeholder="Search products">
    <select id="category-filter">
      <option value="">All</option>
    </select>
    <input type="number" id="min-price" placeholder="Min price">
    <input type="number" id="max-price" placeholder="Max price">
    <select id="sort-select">
      <option value="">Default</option>
      <option value="price_asc">Price low to high</option>
      <option value="price_desc">Price high to low</option>
    </select>
    <button id="apply-filters" class="btn primary" type="button">Apply Filters</button>
    <button id="clear-filters" class="btn" type="button">Clear Filters</button>
  </section>
  <p id="page-message" class="msg"></p>
  <p id="no-results" class="msg" hidden>No products found.</p>
  <section id="product-list" class="product-grid"></section>
</main>
</body>
</html>
