<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCart - Register</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% include "nav.html" %}
<main>
  <section class="card narrow">
    <h1>Register</h1>
    <p id="reg-error" class="msg msg-error"></p>
    <label for="reg-name">Name (2-50 characters)</label>
    <input type="text" id="reg-name" placeholder="Your name">
    <label for="reg-email">Email</label>
    <input type="text" id="reg-email" placeholder="you@example.com">
    <label for="reg-password">Password (6-20 characters)</label>
    <input type="password" id="reg-password" placeholder="Password">
    <button id="reg-submit" class="btn primary" type="button">Register</button>
    <p>Already have an account? <a href="/login">Login</a></p>
  </section>
</main>
</body>
</html>
