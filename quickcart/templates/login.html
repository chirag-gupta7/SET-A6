<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCart - Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% include "nav.html" %}
<main>
  <section class="card narrow">
    <h1>Login</h1>
    <p id="login-success" class="msg msg-success" hidden>Registration successful! Please log in.</p>
    <p id="login-error" class="msg msg-error"></p>
    <label for="login-email">Email</label>
    <input type="text" id="login-email" placeholder="you@example.com">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="Password">
    <button id="login-submit" class="btn primary" type="button">Login</button>
    <p>New here? <a href="/register">Create an account</a></p>
  </section>
</main>
</body>
</html>
