<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCart - Profile</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% include "nav.html" %}
<main>
  <section class="card narrow">
    <h1>Profile</h1>
    <label for="profile-name">Name (2-50 characters)</label>
    <input type="text" id="profile-name">
    <label for="profile-email">Email</label>
    <input type="text" id="profile-email" readonly>
    <label for="profile-phone">Phone (optional, 10 digits)</label>
    <input type="text" id="profile-phone">
    <label for="profile-address">Address</label>
    <input type="text" id="profile-address">
    <button id="profile-save" class="btn primary" type="button">Save</button>
    <p id="profile-message" class="msg"></p>
  </section>
</main>
</body>
</html>
